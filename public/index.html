<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contract Editor - General Purpose Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      color: #60a5fa;
      margin-top: 0.5rem;
    }

    .upload-section {
      background: #1e293b;
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid #334155;
    }

    .file-input-wrapper {
      border: 2px dashed #334155;
      border-radius: 0.75rem;
      padding: 2rem;
      text-align: center;
      margin-bottom: 1.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .file-input-wrapper:hover {
      border-color: #60a5fa;
      background: rgba(96, 165, 250, 0.1);
    }

    .file-input-wrapper.has-file {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
    }

    input[type="file"] {
      display: none;
    }

    .file-label {
      display: block;
      font-size: 1rem;
      color: #94a3b8;
    }

    .file-name {
      color: #10b981;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 1rem;
      color: #e2e8f0;
      font-size: 1rem;
      resize: vertical;
      min-height: 100px;
      margin-bottom: 1.5rem;
    }

    textarea:focus {
      outline: none;
      border-color: #60a5fa;
    }

    textarea::placeholder {
      color: #64748b;
    }

    button {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .results {
      display: none;
    }

    .results.show {
      display: block;
    }

    .result-card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 1px solid #334155;
    }

    .result-card h3 {
      font-size: 1rem;
      color: #60a5fa;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .result-card h3 .step-number {
      background: #3b82f6;
      color: white;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
    }

    .status-banner {
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
    }

    .status-banner.pass {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #10b981;
    }

    .status-banner.fail {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .status-banner.blocked {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #f59e0b;
    }

    .change-item {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      border-left: 3px solid #60a5fa;
    }

    .change-item .id {
      font-weight: 600;
      color: #60a5fa;
      font-size: 0.85rem;
    }

    .change-item .intent {
      display: inline-block;
      background: #334155;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      margin-left: 0.5rem;
    }

    .change-item .fragment {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    .candidate {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
    }

    .candidate .location {
      color: #a78bfa;
      font-weight: 500;
    }

    .candidate .excerpt {
      color: #64748b;
      font-style: italic;
      margin: 0.25rem 0;
      word-break: break-all;
    }

    .candidate .confidence {
      color: #10b981;
      font-size: 0.75rem;
    }

    .edit-spec {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .edit-spec .meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .edit-spec .meta span {
      font-size: 0.75rem;
      background: #334155;
      padding: 0.15rem 0.5rem;
      border-radius: 0.25rem;
    }

    .edit-spec .text-block {
      margin-top: 0.75rem;
    }

    .edit-spec .text-block label {
      font-size: 0.75rem;
      color: #64748b;
      display: block;
      margin-bottom: 0.25rem;
    }

    .edit-spec .text-block pre {
      background: #1e293b;
      padding: 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 100px;
      overflow-y: auto;
    }

    .edit-spec .text-block.before pre {
      border-left: 3px solid #ef4444;
    }

    .edit-spec .text-block.after pre {
      border-left: 3px solid #10b981;
    }

    .execution {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .execution .status-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .execution .status-item {
      font-size: 0.85rem;
    }

    .execution .status-item.success {
      color: #10b981;
    }

    .execution .status-item.error {
      color: #ef4444;
    }

    .execution .block-reason {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      padding: 0.5rem;
      border-radius: 0.25rem;
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .verification-detail {
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }

    .verification-detail .spec-id {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .verification-detail .checks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.5rem;
    }

    .verification-detail .check {
      font-size: 0.85rem;
    }

    .verification-detail .check.pass {
      color: #10b981;
    }

    .verification-detail .check.fail {
      color: #ef4444;
    }

    .integrity {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .integrity .item {
      background: #0f172a;
      padding: 0.75rem;
      border-radius: 0.5rem;
      text-align: center;
    }

    .integrity .item .label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .integrity .item .value {
      font-size: 1rem;
      font-weight: 600;
    }

    .integrity .item .value.yes {
      color: #10b981;
    }

    .integrity .item .value.no {
      color: #ef4444;
    }

    .timing {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.5rem;
    }

    .timing .item {
      background: #0f172a;
      padding: 0.5rem;
      border-radius: 0.25rem;
      text-align: center;
    }

    .timing .item .label {
      font-size: 0.7rem;
      color: #64748b;
    }

    .timing .item .value {
      font-size: 0.9rem;
      color: #60a5fa;
    }

    .download-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      margin-top: 1rem;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      padding: 1rem;
      border-radius: 0.75rem;
      color: #ef4444;
      margin-bottom: 1rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Contract Editor</h1>
      <p class="subtitle">General-Purpose Contract Editing Engine</p>
      <span class="badge">Structural &amp; Semantic Analysis</span>
    </header>

    <section class="upload-section">
      <div class="file-input-wrapper" id="fileWrapper">
        <input type="file" id="fileInput" accept=".docx">
        <label class="file-label">Click to upload DOCX file</label>
        <p class="file-name" id="fileName"></p>
      </div>

      <textarea id="instruction" placeholder="Enter your change request in natural language...&#10;&#10;Examples:&#10;- 계약금액을 5,000만원에서 7,000만원으로 변경해주세요&#10;- 계약기간을 2025년 12월 31일까지로 연장해주세요&#10;- 제5조 위약금 조항에서 10%를 15%로 수정해주세요"></textarea>

      <button id="submitBtn" onclick="submitEdit()">Apply Changes</button>
    </section>

    <div class="error-message" id="errorMessage"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Processing document...</p>
      <p style="font-size: 0.85rem; color: #64748b;">Analyzing structure and applying changes</p>
    </div>

    <section class="results" id="results">
      <!-- Status Banner -->
      <div class="status-banner" id="statusBanner"></div>

      <!-- 1. Change Items -->
      <div class="result-card">
        <h3><span class="step-number">1</span> Change Items</h3>
        <div id="changeItems"></div>
      </div>

      <!-- 2. Candidate Locations -->
      <div class="result-card">
        <h3><span class="step-number">2</span> Candidate Locations</h3>
        <div id="candidates"></div>
      </div>

      <!-- 3. Edit Specifications -->
      <div class="result-card">
        <h3><span class="step-number">3</span> Edit Specifications</h3>
        <div id="editSpecs"></div>
      </div>

      <!-- 4. Execution Results -->
      <div class="result-card">
        <h3><span class="step-number">4</span> Execution Results (BEFORE / AFTER)</h3>
        <div id="executions"></div>
      </div>

      <!-- 5. Verification -->
      <div class="result-card">
        <h3><span class="step-number">5</span> Verification</h3>
        <div id="verification"></div>
      </div>

      <!-- Timing -->
      <div class="result-card">
        <h3>Timing</h3>
        <div class="timing" id="timing"></div>
      </div>

      <!-- Download -->
      <button class="download-btn" id="downloadBtn" style="display: none;" onclick="downloadFile()">
        Download Modified Document
      </button>
    </section>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const fileWrapper = document.getElementById('fileWrapper');
    const fileName = document.getElementById('fileName');
    let downloadUrl = null;

    fileWrapper.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileName.textContent = e.target.files[0].name;
        fileWrapper.classList.add('has-file');
      } else {
        fileName.textContent = '';
        fileWrapper.classList.remove('has-file');
      }
    });

    async function submitEdit() {
      const file = fileInput.files[0];
      const instruction = document.getElementById('instruction').value;

      if (!file) {
        alert('Please upload a DOCX file');
        return;
      }

      if (!instruction.trim()) {
        alert('Please enter a change instruction');
        return;
      }

      // Reset UI
      document.getElementById('results').classList.remove('show');
      document.getElementById('loading').classList.add('show');
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('downloadBtn').style.display = 'none';
      document.getElementById('submitBtn').disabled = true;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('instruction', instruction);

      try {
        const response = await fetch('/api/edit', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        document.getElementById('loading').classList.remove('show');
        document.getElementById('submitBtn').disabled = false;

        if (response.ok) {
          displayResults(result);
        } else {
          showError(result.error || 'Request failed');
        }
      } catch (error) {
        document.getElementById('loading').classList.remove('show');
        document.getElementById('submitBtn').disabled = false;
        showError(error.message);
      }
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function displayResults(result) {
      document.getElementById('results').classList.add('show');

      // Status Banner
      const statusBanner = document.getElementById('statusBanner');
      const status = result.verification?.status || 'FAIL';
      statusBanner.className = `status-banner ${status.toLowerCase()}`;
      statusBanner.textContent = status === 'PASS'
        ? '✓ VERIFICATION PASSED - Changes Applied Successfully'
        : status === 'BLOCKED'
        ? '⚠ BLOCKED - Changes not applied due to ambiguity'
        : '✗ VERIFICATION FAILED - ' + (result.verification?.summary || 'Unknown error');

      // 1. Change Items
      const changeItemsEl = document.getElementById('changeItems');
      changeItemsEl.innerHTML = (result.changeItems || []).map(item => `
        <div class="change-item">
          <span class="id">${item.id}</span>
          <span class="intent">${item.intent}</span>
          <p class="fragment">"${item.userRequestFragment}"</p>
          ${item.ambiguityNote ? `<p style="color: #f59e0b; font-size: 0.85rem; margin-top: 0.5rem;">⚠ ${item.ambiguityNote}</p>` : ''}
        </div>
      `).join('') || '<p style="color: #64748b;">No change items</p>';

      // 2. Candidates
      const candidatesEl = document.getElementById('candidates');
      let candidatesHtml = '';
      for (const item of (result.changeItems || [])) {
        candidatesHtml += `<p style="color: #60a5fa; font-weight: 500; margin-bottom: 0.5rem;">${item.id}</p>`;
        for (const candidate of (item.candidates || [])) {
          candidatesHtml += `
            <div class="candidate">
              <p class="location">${candidate.locationDescription}</p>
              <p class="excerpt">"${candidate.excerptFromDocument?.substring(0, 100)}..."</p>
              <p class="confidence">${candidate.rationale} (${(candidate.confidence * 100).toFixed(0)}%)</p>
            </div>
          `;
        }
      }
      candidatesEl.innerHTML = candidatesHtml || '<p style="color: #64748b;">No candidates</p>';

      // 3. Edit Specs
      const editSpecsEl = document.getElementById('editSpecs');
      editSpecsEl.innerHTML = (result.editSpecs || []).map(spec => `
        <div class="edit-spec">
          <div class="meta">
            <span>${spec.changeItemId}</span>
            <span>${spec.targetUnit}</span>
            <span>${spec.editType}</span>
          </div>
          <div class="text-block before">
            <label>BEFORE (to replace)</label>
            <pre>${escapeHtml(spec.beforeText || '')}</pre>
          </div>
          <div class="text-block after">
            <label>AFTER (new text)</label>
            <pre>${escapeHtml(spec.afterText || '')}</pre>
          </div>
        </div>
      `).join('') || '<p style="color: #64748b;">No edit specs</p>';

      // 4. Executions
      const executionsEl = document.getElementById('executions');
      executionsEl.innerHTML = (result.executions || []).map(exec => `
        <div class="execution">
          <p style="font-weight: 600; margin-bottom: 0.5rem;">${exec.editSpecId}</p>
          <div class="status-row">
            <span class="status-item ${exec.anchorFound ? 'success' : 'error'}">
              Anchor: ${exec.anchorFound ? '✓ Found' : '✗ Not Found'}
            </span>
            <span class="status-item ${exec.applied ? 'success' : 'error'}">
              Applied: ${exec.applied ? '✓ Yes' : '✗ No'}
            </span>
            <span class="status-item">Location: P${exec.locationIndex}</span>
          </div>
          ${exec.blockReason ? `<div class="block-reason">❌ ${exec.blockReason}</div>` : ''}
          <div class="text-block before" style="margin-top: 0.75rem;">
            <label>BEFORE</label>
            <pre>${escapeHtml(exec.beforeText || '')}</pre>
          </div>
          <div class="text-block after">
            <label>AFTER</label>
            <pre>${escapeHtml(exec.afterText || '')}</pre>
          </div>
        </div>
      `).join('') || '<p style="color: #64748b;">No executions</p>';

      // 5. Verification
      const verificationEl = document.getElementById('verification');
      const v = result.verification || {};
      let verificationHtml = `<p style="font-size: 0.9rem; margin-bottom: 1rem;">${v.summary || 'No summary'}</p>`;

      for (const specResult of (v.specResults || [])) {
        verificationHtml += `
          <div class="verification-detail">
            <p class="spec-id">${specResult.editSpecId}: <span style="color: ${specResult.status === 'PASS' ? '#10b981' : '#ef4444'}">${specResult.status}</span></p>
            <div class="checks">
              <span class="check ${specResult.afterTextFound ? 'pass' : 'fail'}">
                after_text: ${specResult.afterTextFound ? '✓' : '✗'}
              </span>
              <span class="check ${specResult.locationCorrect ? 'pass' : 'fail'}">
                location: ${specResult.locationCorrect ? '✓' : '✗'}
              </span>
              <span class="check ${specResult.boundaryRespected ? 'pass' : 'fail'}">
                boundary: ${specResult.boundaryRespected ? '✓' : '✗'}
              </span>
              <span class="check">match: ${specResult.evidence?.matchPercentage || 0}%</span>
            </div>
            ${specResult.failureReason ? `<p style="color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem;">❌ ${specResult.failureReason}</p>` : ''}
          </div>
        `;
      }

      const integrity = v.documentIntegrity || {};
      verificationHtml += `
        <div class="integrity">
          <div class="item">
            <p class="label">Valid</p>
            <p class="value ${integrity.valid ? 'yes' : 'no'}">${integrity.valid ? '✓' : '✗'}</p>
          </div>
          <div class="item">
            <p class="label">Can Open</p>
            <p class="value ${integrity.canOpen ? 'yes' : 'no'}">${integrity.canOpen ? '✓' : '✗'}</p>
          </div>
          <div class="item">
            <p class="label">Structure</p>
            <p class="value ${integrity.structurePreserved ? 'yes' : 'no'}">${integrity.structurePreserved ? '✓' : '✗'}</p>
          </div>
        </div>
      `;
      verificationEl.innerHTML = verificationHtml;

      // Timing
      const timingEl = document.getElementById('timing');
      const t = result.timing || {};
      timingEl.innerHTML = `
        <div class="item"><p class="label">Interpret</p><p class="value">${t.interpretMs || 0}ms</p></div>
        <div class="item"><p class="label">Spec Gen</p><p class="value">${t.specGenMs || 0}ms</p></div>
        <div class="item"><p class="label">Execute</p><p class="value">${t.executeMs || 0}ms</p></div>
        <div class="item"><p class="label">Verify</p><p class="value">${t.verifyMs || 0}ms</p></div>
        <div class="item"><p class="label">Total</p><p class="value">${t.totalMs || 0}ms</p></div>
      `;

      // Download button
      if (result.downloadUrl) {
        downloadUrl = result.downloadUrl;
        document.getElementById('downloadBtn').style.display = 'block';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function downloadFile() {
      if (downloadUrl) {
        window.location.href = downloadUrl;
      }
    }
  </script>
</body>
</html>
